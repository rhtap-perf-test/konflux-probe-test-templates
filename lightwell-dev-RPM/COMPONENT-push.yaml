---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    kueue.konflux-ci.dev/requests-localhost: "1"
    build.appstudio.openshift.io/repo: '{{ source_url }}/-/tree/{{ revision }}'
    build.appstudio.redhat.com/commit_sha: '{{ revision }}'
    build.appstudio.redhat.com/target_branch: '{{ target_branch }}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: APPLICATION
    appstudio.openshift.io/component: COMPONENT
    pipelines.appstudio.openshift.io/type: build
  name: COMPONENT-on-push
  namespace: NAMESPACE
spec:
  params:
    - name: build-platforms
      value:
        - linux/amd64
        - linux/arm64
    - name: package-name
      value: libecpg
    - name: git-url
      value: "{{ source_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: ociStorage
      value: "quay.io/redhat-user-workloads-stage/$(context.taskRun.namespace)/COMPONENT:$(params.revision)"
    - name: self-ref-url
      value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
    - name: self-ref-revision
      value: 46beee00ad98ed4f56b2177d09344b5654bdabb7
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/konflux-ci/rpmbuild-pipeline.git
      - name: revision
        value: 46beee00ad98ed4f56b2177d09344b5654bdabb7
      - name: pathInRepo
        value: pipeline/build-rpm-package.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-COMPONENT
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
