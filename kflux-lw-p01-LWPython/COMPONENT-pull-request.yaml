apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: REPOURL?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: APPLICATION
    appstudio.openshift.io/component: COMPONENT
    pipelines.appstudio.openshift.io/type: build
  name: COMPONENT-on-pull-request
  namespace: NAMESPACE
spec:
  timeouts:
    pipeline: "1h"
  params:
  - name: PACKAGE
    value: ntplib
  - name: VERSION
    value: 0.4.0
  - name: LIGHTWELL_BUILDS_REPO_URL
    value: https://gitlab.cee.redhat.com/jhutar/lw-pypi.org-ntplib-1
  - name: LIGHTWELL_BUILDS_TAG
    value: ntplib/0.4.0
  - name: FIX_TYPE
    # source-to-sdist: must be Backport or Novel (ADR-0020 B/N calculation).
    value: Novel
  - name: BUILD_CONFIGS_REPO_URL
    # source-to-sdist resolve-version-overrides (calunga defaults from orchestrator).
    value: https://gitlab.cee.redhat.com/lightwell/lightwell-builds/build-configs/calunga-python
  - name: BUILD_CONFIGS_REVISION
    value: main
  - name: IMAGE
    # Component ImageRepository path (same pattern as other Konflux probes).
    value: quay.io/QUAY_REPO/NAMESPACE/COMPONENT:on-pr-{{revision}}
  - name: ociStorage
    value: quay.io/QUAY_REPO/NAMESPACE/COMPONENT:on-pr-{{revision}}-ta
  - name: ociArtifactExpiresAfter
    value: "5d"
  - name: IMAGE_EXPIRES_AFTER
    value: "5d"
  pipelineSpec:
    description: |
      LWPython perf probe for kflux-lw-p01 (KONFLUX-15981). Build CVE-remediated Python
      wheels from a lightwell-builds git repository. Pipeline flow from
      konflux-lightwell/lightwell-konflux-orchestrator python-remediated-build.
      ClamAV scan omitted for perf probe (build-only).
    params:
    - name: PACKAGE
      type: string
    - name: VERSION
      type: string
    - name: LIGHTWELL_BUILDS_REPO_URL
      type: string
    - name: LIGHTWELL_BUILDS_TAG
      type: string
    - name: FIX_TYPE
      type: string
      default: Novel
    - name: BUILD_CONFIGS_REPO_URL
      type: string
      default: https://gitlab.cee.redhat.com/lightwell/lightwell-builds/build-configs/calunga-python
    - name: BUILD_CONFIGS_REVISION
      type: string
      default: main
    - name: IMAGE
      type: string
    - name: ociStorage
      type: string
    - name: ociArtifactExpiresAfter
      type: string
      default: ""
    - name: IMAGE_EXPIRES_AFTER
      type: string
      default: ""
    - name: WHEEL_SERVER_URL
      type: string
      default: ""
    - name: caTrustConfigMapName
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      default: ca-bundle.crt
    results:
    - name: IMAGE_URL
      value: $(tasks.fromager-build-wheels.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.fromager-build-wheels.results.IMAGE_DIGEST)
    - name: IMAGE_REF
      value: $(tasks.fromager-build-wheels.results.IMAGE_REF)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-lightwell-builds.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-lightwell-builds.results.commit)
    tasks:
    - name: clone-lightwell-builds
      params:
      - name: url
        value: $(params.LIGHTWELL_BUILDS_REPO_URL)
      - name: revision
        value: $(params.LIGHTWELL_BUILDS_TAG)
      - name: ociStorage
        value: $(params.ociStorage).git
      - name: ociArtifactExpiresAfter
        value: $(params.ociArtifactExpiresAfter)
      - name: caTrustConfigMapName
        value: $(params.caTrustConfigMapName)
      - name: caTrustConfigMapKey
        value: $(params.caTrustConfigMapKey)
      - name: depth
        value: "0"
      - name: fetchTags
        value: "true"
      taskRef:
        resolver: bundles
        params:
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
        - name: name
          value: git-clone-oci-ta
        - name: kind
          value: task
    - name: source-to-sdist
      runAfter:
      - clone-lightwell-builds
      params:
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-lightwell-builds.results.SOURCE_ARTIFACT)
      - name: PACKAGE
        value: $(params.PACKAGE)
      - name: VERSION
        value: $(params.VERSION)
      - name: LIGHTWELL_BUILDS_TAG
        value: $(params.LIGHTWELL_BUILDS_TAG)
      - name: FIX_TYPE
        value: $(params.FIX_TYPE)
      - name: BUILD_CONFIGS_REPO_URL
        value: $(params.BUILD_CONFIGS_REPO_URL)
      - name: BUILD_CONFIGS_REVISION
        value: $(params.BUILD_CONFIGS_REVISION)
      - name: ociStorage
        value: $(params.ociStorage).sdist
      - name: ociArtifactExpiresAfter
        value: $(params.ociArtifactExpiresAfter)
      - name: caTrustConfigMapName
        value: $(params.caTrustConfigMapName)
      - name: caTrustConfigMapKey
        value: $(params.caTrustConfigMapKey)
      workspaces:
      - name: git-auth
        workspace: git-auth
      taskRef:
        resolver: bundles
        params:
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-source-to-sdist:0.1@sha256:d9ffa5ea239dea59431d46d72027aa021d01b3666d270bdc464af30d272ca54d
        - name: name
          value: source-to-sdist
        - name: kind
          value: task
    - name: fromager-build-wheels
      runAfter:
      - source-to-sdist
      params:
      - name: SDISTS_ARTIFACT
        value: $(tasks.source-to-sdist.results.SDISTS_ARTIFACT)
      - name: PACKAGE
        value: $(params.PACKAGE)
      - name: VERSION
        value: $(params.VERSION)
      - name: COMPUTED_VERSION
        value: $(tasks.source-to-sdist.results.COMPUTED_VERSION)
      - name: IMAGE
        value: $(params.IMAGE)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.IMAGE_EXPIRES_AFTER)
      - name: WHEEL_SERVER_URL
        value: $(params.WHEEL_SERVER_URL)
      - name: caTrustConfigMapName
        value: $(params.caTrustConfigMapName)
      - name: caTrustConfigMapKey
        value: $(params.caTrustConfigMapKey)
      taskRef:
        resolver: bundles
        params:
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-fromager-build-wheels:0.1@sha256:6c50164261e9b7df815232e4330a7382c37dd1a07d4474b66cf7aceb06b84a17
        - name: name
          value: python-fromager-build-wheels
        - name: kind
          value: task
    workspaces:
    - name: git-auth
  taskRunTemplate:
    serviceAccountName: builder
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
